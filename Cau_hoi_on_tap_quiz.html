<script>const data=[{"n": 1, "orig": "1.\tLý giải về sự ra đời của nhà nước xuất phát từ vũ lực của các bộ tộc này đối với bộ tộc khác. Đây là nội dung của học thuyết nào?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Thuyết bạo lực", "B": "Thuyết thần quyền", "C": "Thuyết gia trưởng", "D": "Thuyết Khế ước xã hội"}, "answer": "A", "marked": ["A"]}, {"n": 2, "orig": "2. Nhận định nào sau đây là sai?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Xã hội cộng sản nguyên thủy đã tồn tại quyền lực Nhà nước", "B": "Cơ sở kinh tế chủ yếu của xã hội cộng sản nguyên thủy là chế độ sở hữu chung về tư liệu sản xuất và sản phẩm lao động", "C": "Hội đồng thị tộc là tổ chức quyền lực cao nhất của thị tộc", "D": "Quyền lực trong xã hội cộng sản nguyên thủy là quyền lực xã hội, chưa mang tính giai cấp"}, "answer": "A", "marked": ["A"]}, {"n": 3, "orig": "3. Đặc trưng của nhà nước không bao gồm?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Ban hành pháp luật và thực hiện quản lý bắt buộc đối với mọi công dân", "B": "Quy định các loại thuế và thực hiện thu thuế dưới hình thức bắt buộc", "C": "Nhà nước có chủ quyền quốc gia", "D": "Quản lý dân cư theo độ tuổi và giới tính"}, "answer": "D", "marked": ["D"]}, {"n": 4, "orig": "4. Hoạt động nào không thuộc chức năng đối nội của Nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Nhà nước Việt Nam chính thức gia nhập tổ chức Thương mại thế giới WTO", "B": "Năm 2013, Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam ban hành Hiến pháp", "C": "Cảnh sát giao thông phát hiện, xử lý vi phạm trong hoạt động vận tải, tiềm ẩn nguy cơ mất an toàn giao thông.", "D": "Tòa án nhân dân Khu vực 1 - Hà Tĩnh mở phiên tòa xét xử lưu động tại phường Trần Phú."}, "answer": "A", "marked": ["A"]}, {"n": 5, "orig": "5. Trong lịch sử của xã hội có giai cấp đã tồn tại bốn kiểu nhà nước. Kiểu nhà nước nào sau đây chưa từng tồn tại?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Kiểu nhà nước công xã nguyên thủy", "B": "Kiểu nhà nước chiếm hữu nô lệ", "C": "Kiểu nhà nước phong kiến", "D": "Kiểu nhà nước tư sản"}, "answer": "A", "marked": ["A"]}, {"n": 6, "orig": "6. Nhận định nào sau đây đúng?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Nhà nước chủ nô chỉ mang bản chất giai cấp", "B": "Các nhà nước hiện đại ngày nay không tồn tại bản chất giai cấp", "C": "Nhà nước phong kiến mang đậm bản chất giai cấp", "D": "Bản chất xã hội chỉ tồn tại trong các nhà nước hiện đại ngày nay"}, "answer": "C", "marked": ["C"]}, {"n": 7, "orig": "7. Thời kỳ công xã nguyên thủy không tồn tại?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Thị tộc", "B": "Nhà nước", "C": "Tập quán", "D": "Chế độ mẫu hệ"}, "answer": "B", "marked": ["B"]}, {"n": 8, "orig": "8. Bản chất giai cấp của nhà nước thể hiện thông qua sự thống trị của nhà nước trong 3 lĩnh vực:", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Xã hội, kinh tế, văn hóa", "B": "Chính trị, văn hóa, xã hội", "C": "Kinh tế, chính trị, tư tưởng", "D": "Tư tưởng, quân sự, công nghệ"}, "answer": "C", "marked": ["C"]}, {"n": 9, "orig": "9. Trong xã hội cộng sản nguyên thủy, dân cư được phân bổ theo:", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Tổ chức thị tộc, bộ lạc", "B": "Tôn giáo", "C": "Giai cấp", "D": "Đơn vị hành chính lãnh thổ"}, "answer": "A", "marked": ["A"]}, {"n": 10, "orig": "10. Hình thái kinh tế - xã hội nào là chưa có Nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Hình thái kinh tế - xã hội phong kiến", "B": "Hình thái kinh tế - xã hội công xã nguyên thủy", "C": "Hình thái kinh tế - xã hội tư bản chủ nghĩa", "D": "Hình thái kinh tế - xã hội chiếm hữu nô lệ Câu hỏi phân loại: Trung bình"}, "answer": null, "marked": ["B", "D"]}, {"n": 11, "orig": "11. Một trong các chức năng đối nội quan trọng của Nhà nước là gì?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Thúc đẩy tăng cường các hoạt động hợp tác liên quốc gia bền chặt", "B": "Thực hiện ký kết các hiệp định thương mại tự do với các quốc gia", "C": "Bảo vệ an ninh, trật tự xã hội và bảo vệ quyền lợi hợp pháp của công dân", "D": "Thiết lập các mối quan hệ hợp tác quốc tế bền vững lâu dài"}, "answer": "C", "marked": ["C"]}, {"n": 12, "orig": "12. Thuộc tính chung của bản chất Nhà nước là:", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Tính giai cấp", "B": "Tính xã hội", "C": "Tính giai cấp và tính xã hội", "D": "Tính giai cấp, tính xã hội và tính cưỡng chế"}, "answer": "C", "marked": ["C"]}, {"n": 13, "orig": "13. Khẳng định nào sau đây là ĐÚNG về bản chất Nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Bất cứ nhà nước nào cũng thể hiện bản chất giai cấp rõ nét hơn bản chất xã hội", "B": "Bất cứ nhà nước nào cũng chỉ là bộ máy dùng để duy trì sự thống trị của giai cấp này đối với giai cấp khác", "C": "Bất cứ nhà nước nào cũng thể hiện bản chất xã hội rõ nét hơn bản chất giai cấp", "D": "Bất cứ nhà nước nào cũng đều mang bản chất giai cấp và bản chất xã hội"}, "answer": "D", "marked": ["D"]}, {"n": 14, "orig": "14. Theo quan điểm của chủ nghĩa Mác-Lênin thì nguyên nhân chủ yếu làm xuất hiện nhà nước là:", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Do sự phân công lao động trong xã hội", "B": "Do sự phân hóa giai cấp và kết quả của đấu tranh giai cấp, hình thành khi xã hội loài người đạt đến một trình độ nhất định.", "C": "Do con người trong xã hội phải hợp sức lại để đắp đê, chống bão lụt, đào kênh làm thủy lợi và chống giặc ngoại xâm", "D": "Do ý chí của con người trong xã hội"}, "answer": "B", "marked": ["B"]}, {"n": 15, "orig": "15. Hoạt động nào sau đây thuộc chức năng đối ngoại của nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Tuyển chọn và gọi công dân nhập ngũ", "B": "Triển khai chương trình giáo dục đổi mới với hệ thống sách giáo khoa song ngữ", "C": "Đàm phán sửa đổi Hiệp định song phương giữa Việt Nam và Hoa Kỳ", "D": "Đề ra chính sách tăng cường số hóa trong hệ thống các cơ quan hành chính"}, "answer": "C", "marked": ["C"]}, {"n": 16, "orig": "16. “Nhà nước không phải là hiện tượng xã hội vĩnh cửu, bất biến” là khẳng định về nguồn gốc Nhà nước theo quan điểm của?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Mác-Lênin", "B": "J.J.Rousseau", "C": "Duyring", "D": "Aristote"}, "answer": "A", "marked": ["A"]}, {"n": 17, "orig": "17. Khẳng định nào sau đây là ĐÚNG về Nhà nước theo quan điểm của chủ nghĩa Mác-Lênin?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Nhà nước là hiện tượng tự nhiên mang tính vĩnh cửu, bất biến", "B": "Nhà nước là sản phẩm và là biểu hiện của những mâu thuẫn giai cấp có thể điều hòa được", "C": "Nhà nước là hiện tượng xuất hiện và tồn tại cùng với sự xuất hiện, tồn tại của lịch sử xã hội loài người", "D": "Nhà nước là hiện tượng xã hội mang tính lịch sử, nảy sinh từ xã hội nhằm đáp ứng nhu cầu của xã hội"}, "answer": "D", "marked": ["D"]}, {"n": 18, "orig": "18. Quản lý xã hội, xây dựng và phát triển nền kinh tế, phát triển giáo dục, khoa học công nghệ, chính sách tiền tệ...là những mặt hoạt động chủ yếu thể hiện chức năng nào của nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Chức năng đối nội", "B": "Chức năng đối ngoại", "C": "Chức năng bảo vệ", "D": "Chức năng điều chỉnh"}, "answer": "A", "marked": ["A"]}, {"n": 19, "orig": "19. Theo Học thuyết Mác-Lênin, lịch sử đã trải qua bao nhiêu lần phân công lao động lớn:", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "2", "B": "3", "C": "4", "D": "5"}, "answer": "B", "marked": ["B"]}, {"n": 20, "orig": "20. Theo quan điểm của chủ nghĩa Mác-Lênin, Nhà nước xét về bản chất trước hết là gì?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Tổ chức phục vụ lợi ích cộng đồng. Chủ nô - Chiếm hữu nô lệ - Tư bản - XHCN", "B": "Tổ chức quyền lực chính trị nhằm xây dựng Nhà nước pháp quyền. Chủ nô - Phong kiến - Tư hữu - XHCN", "C": "Bộ máy trấn áp đặc biệt của giai cấp này đối với giai cấp khác, là bộ máy để duy trì sự thống trị giai cấp. Địa chủ - Nông nô, phong kiến - Tư bản – XHCN", "D": "Phương thức tổ chức đảm bảo lợi ích chung của xã hội. Câu hỏi phân loại: Khó 22 . Lịch sử xã hội loài người đã tồn tại những kiểu Nhà nước nào? Chủ nô - Phong kiến - Tư sản – XHCN"}, "answer": null, "marked": ["C", "D"]}, {"n": 21, "orig": "23. Khẳng định:“ Những phương hướng, phương diện hoặc mặt hoạt động chủ yếu của nhà nước nhằm thực hiện các nhiệm vụ cơ bản của nhà nước” là khái niệm về:", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Bản chất nhà nước", "B": "Chức năng nhà nước", "C": "Nguồn gốc nhà nước", "D": "Hình thức nhà nước"}, "answer": "B", "marked": ["B"]}, {"n": 22, "orig": "24. Nhận định nào dưới đây ĐÚNG về bản chất giai cấp của nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Nhà nước chỉ ra đời và tồn tại trong xã hội có giai cấp và là sự biểu hiện không điều hòa được của các mâu thuẫn giai cấp đối kháng", "B": "Nhà nước chỉ mang bản chất giai cấp khi giai cấp thống trị nắm quyền lực kinh tế chủ yếu trong xã hội", "C": "Nhà nước chỉ thống trị ở mặt kinh tế và tư tưởng trong xã hội có giai cấp để hợp pháp hóa ý chí của giai cấp thống trị thành ý chí của nhà nước", "D": "Nhà nước chỉ tồn tại để bảo vệ lợi ích của giai cấp thống trị trong xã hội"}, "answer": "A", "marked": ["A"]}, {"n": 23, "orig": "25. Hoạt động nào sau đây thể hiện bản chất xã hội của nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Chỉ cho phép tầng lớp quý tộc có quyền bầu cử", "B": "Quy định nô lệ là tài sản của chủ nô", "C": "Đàn áp các cuộc đấu tranh đòi quyền lợi của nhân dân", "D": "Đảm bảo các quyền chăm sóc y tế của nhân dân"}, "answer": "D", "marked": ["D"]}, {"n": 24, "orig": "26. Hoạt động nào thuộc chức năng đối ngoại của nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Bộ Công an cấp căn cước gắn chíp cho công dân", "B": "Chủ tịch nước ban hành quyết định đặc xá", "C": "Đại diện Bộ ngoại giao Việt Nam lên án mạnh mẽ các vụ tấn công khủng bố tại Indonesia", "D": "Tòa án nhân dân thành phố Hồ Chí Minh xét xử bị cáo Ugah Victor Uchenna (quốc tịch Nigeria) về tội Vận chuyển trái phép chất ma túy"}, "answer": "C", "marked": ["C"]}, {"n": 25, "orig": "27. Nhà nước do giai cấp thống trị lập nên để bảo vệ quyền và lợi ích của giai cấp mình là quan điểm của học thuyết:", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Mác-Lênin", "B": "Gia trưởng", "C": "Thần học", "D": "Khế ước xã hội"}, "answer": "A", "marked": ["A"]}, {"n": 26, "orig": "28. Chức năng nào sau đây là chức năng đối nội của nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Thiết lập quan hệ ngoại giao với các nhà nước khác", "B": "Gia nhập các tổ chức quốc tế", "C": "Xây dựng và phát triển nền kinh tế quốc gia", "D": "Chống lại sự can thiệp nội bộ của các nhà nước khác"}, "answer": "C", "marked": ["C"]}, {"n": 27, "orig": "29. Chức năng đối ngoại của nhà nước KHÔNG bao gồm hoạt động nào sau đây?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Ký kết các hiệp định quốc tế.", "B": "Tham gia các tổ chức quốc tế.", "C": "Xây dựng và phát triển kinh tế quốc gia.", "D": "Xây dựng mối quan hệ ngoại giao với các nước."}, "answer": "C", "marked": ["C"]}, {"n": 28, "orig": "30. Hoạt động nào sau đây thuộc chức năng đối ngoại của nhà nước?", "chapter": "Chương 1: Khái niệm, bản chất và chức năng của Nhà nước", "options": {"A": "Tổ chức bầu cử Đại biểu Quốc hội và Hội đồng nhân dân các cấp", "B": "Triển khai chương trình giáo dục đổi mới với hệ thống sách giáo khoa song ngữ", "C": "Đàm phán ký kết Hiệp định đa phương giữa Việt Nam và các nước Châu Á – Thái Bình Dương", "D": "Phát triển đề án chính phủ điện tử trong bối cảnh hội nhập quốc tế và cách mạng công nghệ 4.0 Chương 2. Hình thức nhà nước"}, "answer": null, "marked": ["C", "D"]}, {"n": 29, "orig": "31. Khái niệm Hình thức nhà nước bao gồm:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Thể chế chính trị và chính quyền địa phương", "B": "Chính quyền trung ương và địa phương", "C": "Hình thức chính thể, hình thức cấu trúc và chế độ chính trị.", "D": "Bộ máy nhà nước và pháp luật"}, "answer": "C", "marked": ["C"]}, {"n": 30, "orig": "32. Chế độ chính trị phản ánh điều gì?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Cơ cấu kinh tế", "B": "Hình thức dân chủ và phi dân chủ của nhà nước", "C": "Chính sách xã hội", "D": "Mô hình phát triển kinh tế"}, "answer": null, "marked": []}, {"n": 31, "orig": "33. Trong chế độ cộng hòa nghị viện, ai là người đứng đầu chính phủ?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Tổng thống", "B": "Vua", "C": "Thủ tướng", "D": "Chủ tịch Quốc hội"}, "answer": "C", "marked": ["C"]}, {"n": 32, "orig": "34. Các quy tắc xử sự điều chỉnh hành vi của con người trong xã hội cộng sản nguyên thủy là:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Những lời răn dạy của các thủ lĩnh", "B": "Quy luật tự nhiên, mạnh được yếu thua", "C": "Bộ luật cổ Hammurabi", "D": "Các tập quán và các tín điều tôn giáo"}, "answer": "D", "marked": ["D"]}, {"n": 33, "orig": "35. Thuật ngữ nào KHÔNG thuộc hình thức chính thể?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Cộng hòa", "B": "Quân chủ", "C": "Liên bang", "D": "Đại nghị"}, "answer": "C", "marked": ["C"]}, {"n": 34, "orig": "36. Hình thức cấu trúc của nhà nước Việt Nam là:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Nhà nước liên bang", "B": "Nhà nước liên minh", "C": "Tất cả đều đúng", "D": "Nhà nước đơn nhất"}, "answer": null, "marked": []}, {"n": 35, "orig": "37. Trong nhà nước cộng hòa tổng thống, quyền lực tập trung mạnh nhất ở cơ quan nào?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Quốc hội", "B": "Tòa án", "C": "Tổng thống", "D": "Chính quyền địa phương"}, "answer": "C", "marked": ["C"]}, {"n": 36, "orig": "38. Hình thức chính thể quân chủ lập hiến là hình thức chính thể của quốc gia", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Pháp", "B": "Việt Nam", "C": "Nhật Bản", "D": "Đức"}, "answer": "C", "marked": ["C"]}, {"n": 37, "orig": "40. Chế độ chính trị phản ánh điều gì?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Các đảng phái trong xã hội", "B": "Phương pháp và cách thức thực hiện quyền lực nhà nước", "C": "Cơ cấu hành chính", "D": "Cách thức tổ chức bầu cử"}, "answer": "B", "marked": ["B"]}, {"n": 38, "orig": "41. Nhà nước cộng hòa có đặc trưng:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Nguyên thủ do thừa kế", "B": "Nguyên thủ do bầu cử và có nhiệm kỳ", "C": "Nguyên thủ có quyền tuyệt đối", "D": "Không tổ chức bầu cử"}, "answer": "B", "marked": ["B"]}, {"n": 39, "orig": "42. Hình thức cấu trúc nhà nước đơn nhất có đặc điểm", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Lãnh thổ có chủ quyền riêng", "B": "Tất cả đều đúng", "C": "Một hệ thống pháp luật", "D": "Hai hệ thống cơ quan nhà nước"}, "answer": "C", "marked": ["C"]}, {"n": 40, "orig": "43. Cộng hòa đại nghị là mô hình trong đó:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Tổng thống có quyền tối thượng", "B": "Quốc hội không có quyền", "C": "Chính phủ chịu trách nhiệm trước Quốc hội", "D": "Tổng thống bổ nhiệm Quốc hội"}, "answer": "C", "marked": ["C"]}, {"n": 41, "orig": "44. Hình thức chính thể nào sau đây không tồn tại chức danh thủ tướng", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Cộng hòa tổng thống", "B": "Quân chủ lập hiến", "C": "Cộng hòa đại nghị", "D": "Cộng hòa lưỡng tính (hỗn hợp)"}, "answer": "A", "marked": ["A"]}, {"n": 42, "orig": "45. Đặc trưng cơ bản của chế độ quân chủ tuyệt đối là:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Thủ tướng đứng đầu nhà nước", "B": "Vua nắm phần lớn quyền lực", "C": "Quốc hội có quyền tối cao", "D": "Vua bị hạn chế quyền bởi hiến pháp"}, "answer": "B", "marked": ["B"]}, {"n": 43, "orig": "46. Đặc trưng quan trọng của nhà nước pháp quyền XHCN Việt Nam là gì?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Phân quyền tuyệt đối", "B": "Quyền lực nhà nước là thống nhất, có sự phân công và phối hợp", "C": "Không có kiểm soát quyền lực", "D": "Quyền tư pháp mạnh nhất"}, "answer": "B", "marked": ["B"]}, {"n": 44, "orig": "47. Chế độ chính trị của Việt Nam là chế độ:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Quân chủ", "B": "Dân chủ quý tộc", "C": "Dân chủ xã hội chủ nghĩa", "D": "Dân chủ chủ nô"}, "answer": "C", "marked": ["C"]}, {"n": 45, "orig": "48. Đặc điểm chính của chế độ chính trị dân chủ xã hội chủ nghĩa là:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Đa đảng cạnh tranh quyền lực", "B": "Quyền lực thuộc về nhân dân, dân chủ rộng rãi", "C": "Các Đảng phái cầm quyền theo nhiệm kỳ", "D": "Vua đứng đầu nhà nước"}, "answer": "B", "marked": ["B"]}, {"n": 46, "orig": "50. Đặc trưng cơ bản của chính thể cộng hòa nghị viện là gì?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Nguyên thủ quốc gia có quyền lực tối cao và nắm quyền hành pháp", "B": "Chính phủ do Quốc hội thành lập và chịu trách nhiệm trước Quốc hội", "C": "Chính phủ do cử tri trực tiếp bầu ra và hoạt động độc lập với Quốc hội", "D": "Quốc hội không thể bất tín nhiệm Chính phủ"}, "answer": "B", "marked": ["B"]}, {"n": 47, "orig": "51. Trong nhà nước liên bang, hiến pháp liên bang có vị trí như thế nào so với hiến pháp bang?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Bằng nhau", "B": "Cao hơn và có hiệu lực tối cao", "C": "Thấp hơn", "D": "Không liên quan"}, "answer": "B", "marked": ["B"]}, {"n": 48, "orig": "55. Yếu tố nào dưới đây không thuộc cấu thành của hình thức nhà nước?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Hình thức chính thể", "B": "Hình thức cấu trúc", "C": "Chế độ chính trị", "D": "Chức năng đối nội của nhà nước"}, "answer": "D", "marked": ["D"]}, {"n": 49, "orig": "56. Chế độ phản dân chủ là:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Vi phạm các quyền dân chủ của nhân dân", "B": "Vi phạm các quyền tự do của nhân dân", "C": "Nhà nước độc tài", "D": "Tất cả đều đúng"}, "answer": "D", "marked": ["D"]}, {"n": 50, "orig": "57. Vấn đề về cách thức tổ chức và trình tự thành lập ra các cơ quan quyền lực tối cao của nhà nước thuộc:", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Hình thức nhà nước", "B": "Hình thức chính thể", "C": "Hình thức cấu trúc nhà nước", "D": "Chế độ chính trị"}, "answer": "B", "marked": ["B"]}, {"n": 51, "orig": "62. Một quốc gia tổ chức theo mô hình liên bang thường có đặc điểm nào sau đây?", "chapter": "Chương 2. Hình thức nhà nước", "options": {"A": "Chỉ có một hệ thống pháp luật thống nhất áp dụng cho mọi địa phương", "B": "Có hai hệ thống pháp luật song song tồn tại", "C": "Tất cả cơ quan hành pháp đều do Quốc hội trung ương bổ nhiệm", "D": "Không tồn tại tòa án bang Chương 3. Bộ máy nhà nước"}, "answer": null, "marked": ["B", "D"]}, {"n": 52, "orig": "64. Theo Hiến pháp năm 2013 (sửa đổi, bổ sung năm 2025), cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam:", "chapter": "Chương 3. Bộ máy nhà nước", "options": {"A": "Chính phủ", "B": "Chủ tịch nước", "C": "Quốc hội", "D": "Tòa án nhân dân"}, "answer": "C", "marked": ["C"]}, {"n": 53, "orig": "65. Bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam được tổ chức và hoạt động theo nguyên tắc nào dưới đây:", "chapter": "Chương 3. Bộ máy nhà nước", "options": {"A": "Nguyên tắc chỉ thực hiện dân chủ trực tiếp", "B": "Nguyên tắc chỉ thực hiện dân chủ đại diện", "C": "Nguyên tắc tập trung dân chủ", "D": "Cả A,B,C"}, "answer": "C", "marked": ["C"]}, {"n": 54, "orig": "75. Theo quy định của Hiến pháp năm 2013 (sửa đổi, bổ sung năm 2025), nhiệm vụ của Tòa án nhân dân là:", "chapter": "Chương 3. Bộ máy nhà nước", "options": {"A": "Xét xử", "B": "Thực hiện quyền hành pháp, quản lý nhà nước thống nhất", "C": "Bảo vệ công lý, bảo vệ quyền con người, quyền công dân, bảo vệ chế độ xã hội chủ nghĩa", "D": "Giám sát tối cao đối với hoạt động của Nhà nước"}, "answer": "C", "marked": ["C"]}, {"n": 55, "orig": "78. Theo quy định của Hiến pháp năm 2013 (sửa đổi, bổ sung năm 2025), cơ quan nhà nước nào thực hiện chức năng thực hành quyền công tố:", "chapter": "Chương 3. Bộ máy nhà nước", "options": {"A": "Tòa án nhân dân", "B": "Cơ quan điều tra", "C": "Viện kiểm sát nhân dân", "D": "Chính phủ"}, "answer": "C", "marked": ["C"]}, {"n": 56, "orig": "81. Đặc điểm nào sau đây không phải là đặc điểm của cơ quan nhà nước:", "chapter": "Chương 3. Bộ máy nhà nước", "options": {"A": "Có tính quyền lực nhà nước", "B": "Pháp luật quy định trình tự thành lập", "C": "Không bị giới hạn về quyền hạn và nhiệm vụ", "D": "Cán bộ công chức làm việc trong các cơ quan nhà nước"}, "answer": "C", "marked": ["C"]}, {"n": 57, "orig": "84. Các nguyên tắc cơ bản về tổ chức và hoạt động của bộ máy nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam không bao gồm:", "chapter": "Chương 3. Bộ máy nhà nước", "options": {"A": "Nguyên tắc tất cả quyền lực nhà nước thuộc về nhân dân", "B": "Nguyên tắc bảo đảm sự lãnh đạo của Đảng cộng sản Việt nam đối với nhà nước", "C": "Nguyên tắc kìm chế và đối trọng giữa các cơ quan lập pháp, hành pháp và tư pháp", "D": "Nguyên tắc bình đẳng và đoàn kết dân tộc"}, "answer": "C", "marked": ["C"]}, {"n": 58, "orig": "98.Theo học thuyết Mác-Lênin, khi nghiên cứu về nguồn gốc của Nhà nước và Pháp luật, thì khẳng định nào sau đây là sai?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Nhà nước và pháp luật cùng phát sinh, tồn tại trong xã hội có giai cấp", "B": "Nhà nước và pháp luật ra đời và tồn tại cùng với sự xuất hiện, tồn tại của lịch sử xã hội loài người", "C": "Nhà nước và Pháp luật có cùng lịch sử ra đời, tồn tại, phát triển và tiêu vong", "D": "Nhà nước và Pháp luật là hiện tượng xã hội mang tính lịch sử"}, "answer": "B", "marked": ["B"]}, {"n": 59, "orig": "99. Nguyên nhân ra đời của Nhà nước và Pháp luật là:", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Hoàn toàn giống nhau", "B": "Hoàn toàn khác nhau", "C": "Do nhu cầu chủ quan của xã hội", "D": "Do nhu cầu khách quan của xã hội"}, "answer": "D", "marked": ["D"]}, {"n": 60, "orig": "100. Pháp luật không tồn tại trong xã hội nào", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Xã hội không có tư hữu", "B": "Xã hội không có giai cấp", "C": "Xã hội không có Nhà nước", "D": "Cả A, B, C đều đúng"}, "answer": "D", "marked": ["D"]}, {"n": 61, "orig": "101. Theo quan điểm của chủ nghĩa Mác – Lênin về Pháp luật thì:", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Pháp luật là một hiện tượng xã hội mang tính lịch sử", "B": "Pháp luật là một hiện tượng xã hội", "C": "Pháp luật là một hiện tượng tự nhiên", "D": "Pháp luật là một hiện tượng tồn tại mãi mãi cùng với sự tồn tại của lịch sử xã hội loài người"}, "answer": "A", "marked": ["A"]}, {"n": 62, "orig": "102. Con đường hình thành pháp luật là do:", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Giai cấp thống trị lập ra", "B": "Có sự vận động, thay đổi, phát triển của xã hội chuyển từ nền kinh tế tự nhiên sang nền kinh tế sản xuất", "C": "Nhà nước đặt ra hoặc thừa nhận", "D": "Xuất phát từ những phong tục, tập quán, tín điều tôn giáo trong xã hội"}, "answer": "C", "marked": ["C"]}, {"n": 63, "orig": "103. Pháp luật là:", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Những quy định mang tính chất bắt buộc chung cho mọi người trong xã hội", "B": "Những quy định mang tính cưỡng chế đối với các cơ quan, tổ chức trong xã hội", "C": "Những quy định do cơ quan Nhà nước ban hành theo trình tự, thủ tục nhất định", "D": "Những quy tắc xử sự mang tính chất bắt buộc chung do Nhà nước đặt ra hoặc thừa nhận, được Nhà nước bảo đảm thực hiện"}, "answer": "D", "marked": ["D"]}, {"n": 64, "orig": "104. Khi nghiên cứu về bản chất của Pháp luật, thì khẳng định nào sau đây là sai?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Pháp luật là ý chí giai cấp thống trị được đề lên thành luật", "B": "Pháp luật bao giờ cũng thể hiện bản chất giai cấp rõ nét hơn bản chất xã hội", "C": "Pháp luật là hiện tượng vừa mang tính giai cấp, vừa mang tính xã hội", "D": "Pháp luật vừa mang tính chủ quan lại vừa mang tính khách quan"}, "answer": "B", "marked": ["B"]}, {"n": 65, "orig": "105. Bản chất giai cấp của Pháp luật được thể hiện:", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Pháp luật là ý chí của giai cấp thống trị được đề lên thành pháp luật", "B": "Pháp luật chính là sự phản chiếu thực tại khách quan", "C": "Pháp luật là công cụ hữu hiệu để tổ chức quản lý xã hội", "D": "Cả A, B, C đều đúng"}, "answer": "A", "marked": ["A"]}, {"n": 66, "orig": "107. Chọn phương án đúng nhất điền vào chỗ trống: Xuất phát từ............, cho nên bất cứ Nhà nước nào cũng dùng pháp l A": "Pháp luật là linh hồn của đường lối chính trị", "B": "Việc thực hiện pháp luật là thực tiễn để kiểm nghiệm về tính đúng đắn và hiệu quả của đường lối chính trị", "C": "Việc thực hiện đường lối, chủ trương, chính sách của Đảng luôn phải dựa trên ý thức pháp luật của nhân dân", "D": "Cả A, B, C đều đúng"}, "answer": "D", "marked": ["D"]}, {"n": 89, "orig": "130. Pháp luật và đạo đức là hai hiện tượng:", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Đều mang tính quy phạm", "B": "Đều mang tính bắt buộc chung", "C": "Đều là quy phạm tồn tại ở dạng thành văn", "D": "Đều do nhà nước đặt ra hoặc thừa nhận"}, "answer": "A", "marked": ["A"]}, {"n": 90, "orig": "131.  Nhận định nào sau đây đúng khi nghiên cứu về sự ra đời của pháp luật?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Pháp luật là những quy tắc xã hội được lưu truyền qua nhiều thế hệ", "B": "Nhà nước đã nâng tập quán từng tồn tại trở thành pháp luật", "C": "Giai cấp thống trị đã chọn lọc những quy phạm xã hội còn phù hợp và ban hành các quy định mới để trở thành pháp luật", "D": "Pháp luật ra đời là kết quả của cuộc tranh giành giữa các giai cấp"}, "answer": "C", "marked": ["C"]}, {"n": 91, "orig": "132. Nhận định nào sau đây sai khi bàn về bản chất của pháp luật?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Pháp luật mang bản chất giai cấp và bản chất xã hội", "B": "Pháp luật phản ánh ý chí của giai cấp thống trị, bảo vệ lợi ích của Nhà nước", "C": "Trong mọi chế độ xã hội, pháp luật là công cụ bảo vệ lợi ích của nhân dân", "D": "Tùy vào mỗi kiểu pháp luật khác nhau, bản chất giai cấp hay bản chất xã hội sẽ thể hiện rõ nét hơn"}, "answer": "C", "marked": ["C"]}, {"n": 92, "orig": "133. Khẳng định nào sau về pháp luật là đúng?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Pháp luật và nhà nước là một  Nhà nước được nâng thành pháp luật", "C": "Pháp luật là sản phẩm của xã hội có giai cấp và đấu tranh giai cấp", "D": "Pháp luật là sự thỏa hiệp về ý chí của mọi người trong xã hội"}, "answer": "C", "marked": ["C"]}, {"n": 97, "orig": "138. Pháp luật phản ánh ý chí của giai cấp thống trị, đây là nội dung thể hiện?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Bản chất giai cấp của pháp luật", "B": "Đặc điểm của pháp luật", "C": "Chức năng của pháp luật", "D": "Bản chất xã hội của pháp luật"}, "answer": "A", "marked": ["A"]}, {"n": 98, "orig": "139. Đáp án nào dưới đây không phải là hình thức pháp luật ?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Tập quán pháp", "B": "Tiền lệ pháp", "C": "Văn bản quy phạm pháp luật", "D": "Nội quy trường học"}, "answer": "D", "marked": ["D"]}, {"n": 99, "orig": "140. Pháp luật có thuộc tính cơ bản là?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Các đáp án còn lại đều đúng", "B": "Tính cưỡng chế", "C": "Tính xác định chặt chẽ về mặt hình thức", "D": "Tính quy phạm và phổ biến"}, "answer": "A", "marked": ["A"]}, {"n": 100, "orig": "141. Theo học thuyết Mác - Lênin, những nguyên nhân dẫn đến sự ra đời của pháp luật là:", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Xuất phát từ sự tan rã của xã hội cộng sản nguyên thủy", "B": "Những nguyên nhân làm phát sinh giai cấp thống trị", "C": "Những nguyên nhân ra đời của nhà nước"}, "answer": null, "marked": []}, {"n": 101, "orig": "142. Nhận định nào sau đây là KHÔNG đúng về mối quan hệ giữa pháp luật và kinh tế:", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Trong mối quan hệ với kinh tế, pháp luật có tính độc lập tương đối", "B": "Nội dung của pháp luật là do các quan hệ kinh tế - xã hội quyết định, chế độ kinh tế là cơ sở của pháp luật", "C": "Pháp luật không thể có sự tác động trở lại đối với sự phát triển của kinh tế vì kinh tế chịu sự điều hành chủ yếu từ thị trường tự do", "D": "Sự thay đổi củ chế độ kinh tế xã hội sớm hay muộn cũng dẫn đến sự thay đổi của pháp luật"}, "answer": "C", "marked": ["C"]}, {"n": 102, "orig": "143. Theo học thuyết Mác - Lênin, những nguyên nhân dẫn đến sự ra đời của pháp luật là:", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Xuất phát từ sự tan rã của xã hội cộng sản nguyên thủy", "B": "Những nguyên nhân làm phát sinh giai cấp thống trị", "C": "Những nguyên nhân ra đời của nhà nước", "D": "Gắn bó mật thiết với giai cấp thống trị"}, "answer": "C", "marked": ["C"]}, {"n": 103, "orig": "144. Đặc điểm nào dưới đây không phải của pháp luật?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Tính bắt buộc chung", "B": "Tính xác định chặt chẽ về mặt hình thứ", "C": "Do tổ chức, cá nhân tự ban hành", "D": "Được đảm bảo thực hiện bằng quyền lực nhà nước"}, "answer": "C", "marked": ["C"]}, {"n": 104, "orig": "145. Pháp luật tồn tại dưới hình thức?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Văn bản quy phạm pháp luật", "B": "Tập quán pháp", "C": "Tất cả đáp án còn lại đều đúng.", "D": "Tiền lệ pháp"}, "answer": "C", "marked": ["C"]}, {"n": 105, "orig": "146. Theo học thuyết Mác – Lênin nguyên nhân dẫn đến sự ra đời của pháp luật?", "chapter": "Chương 4. khái niệm, bản chất, thuộc tính và chức năng pháp luật", "options": {"A": "Khi xã hội không có giai cấp", "B": "Cùng nguyên nhân với nhà nước", "C": "Khi xã hội không có nhà nước", "D": "Khi các tập quán trở nên không hiệu quả Chương 5. văn bản quy phạm pháp luật I. Quy phạm pháp luật DỄ"}, "answer": null, "marked": ["B", "D"]}, {"n": 106, "orig": "147. Chọn phương án đúng nhất điền vào chỗ trống: “…..của quy phạm pháp luật chứa đựng mệnh lệnh của Nhà nước trong việc định hướng hành vi của các chủ thể khi tham gia vào các quan hệ pháp luật.”", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Bộ phận giả định", "B": "Bộ phận quy định", "C": "Bộ phận chế tài", "D": "Bộ phận quy định và bộ phận chế tài"}, "answer": "B", "marked": ["B"]}, {"n": 107, "orig": "148. Những điều kiện, hoàn cảnh có thể xảy ra trong thực tế cuộc sống mà Nhà nước dự liệu và dùng pháp luật tác động, được ghi nhận tại bộ phận….. của quy phạm pháp luật?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Giả định", "B": "Giả thuyết", "C": "Quy định", "D": "Giả định và quy định"}, "answer": "A", "marked": ["A"]}, {"n": 108, "orig": "149. Những biện pháp cưỡng chế Nhà nước dự liệu áp dụng đối với chủ thể không thực hiện đúng pháp luật được ghi nhận tại bộ phận….. của quy phạm pháp luật?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Giả định", "B": "Quy định", "C": "Chế định", "D": "Chế tài"}, "answer": "D", "marked": ["D"]}, {"n": 109, "orig": "150. Giới hạn Nhà nước đưa ra cho phép, cấm đoán, bắt buộc các chủ thể thực hiện hành vi hoặc tiến hành một công việc nhất định được ghi nhận tại bộ phận… của quy phạm pháp luật?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Giả định", "B": "Chế định", "C": "Quy định", "D": "Chế tài"}, "answer": "C", "marked": ["C"]}, {"n": 110, "orig": "151. Trình tự trình bày các bộ phận giả định, quy định, chế tài của quy phạm pháp luật là?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Giả định – Quy định – Chế tài", "B": "Quy định – Chế tài – Giả định", "C": "Giả định – Chế tài – Quy định", "D": "Không có trình tự nhất định TRUNG BÌNH"}, "answer": "D", "marked": ["D"]}, {"n": 111, "orig": "152. Cho quy phạm pháp luật sau: “Phạt tiền từ 18.000.000 đồng đến 20.000.000 đồng đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây: a) Điều khiển xe trên đường mà trong máu hoặc hơi thở có nồng độ cồn vượt quá 50 miligam đến 80 miligam/100 mililít máu hoặc vượt quá 0,25 miligam đến 0,4 miligam/1 lít khí thở;” (điểm a, khoản 9, Điều 6 Nghị định 168/2024/NĐ-CP).", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Phạt tiền từ 18.000.000 đồng đến 20.000.000 đồng” là bộ phận chế tài của quy phạm pháp luật trên.", "B": "“người điều khiển xe” là bộ phận giả định của quy phạm pháp luật trên", "C": "Quy phạm pháp luật trên khuyết thiếu chế tài.", "D": "Quy phạm pháp luật trên chỉ có bộ phận giả định."}, "answer": "A", "marked": ["A"]}, {"n": 112, "orig": "153. Cho quy phạm pháp luật sau: “Người nào thu thập, tàng trữ, trao đổi, mua bán, công khai hóa trái phép thông tin về tài khoản ngân hàng của người khác với số lượng từ 20 tài khoản đến dưới 50 tài khoản hoặc thu lợi bất chính từ 20.000.000 đồng đến dưới 50.000.000 đồng, thì bị phạt tiền từ 20.000.000 đồng đến 100.000.000 đồng hoặc phạt cải tạo không giam giữ đến 03 năm.” (Khoản 1 Điều 291 Bộ luật Hình sự 2015, sửa đổi bổ sung năm 2025)", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Người nào", "B": "Người nào thu thập, tàng trữ, trao đổi, mua bán, công khai hóa trái phép thông tin về tài khoản ngân hàng của người khác với số lượng từ 20 tài khoản đến dưới 50 tài khoản hoặc thu lợi bất chính từ 20.000.000 đồng đến dưới 50.000.000 đồng", "C": "Người nào thu thập, tàng trữ, trao đổi, mua bán, công khai hóa trái phép thông tin về tài khoản ngân hàng của người khác với số lượng từ 20 tài khoản đến dưới 50 tài khoản", "D": "Quy phạm pháp luật trên khuyết thiếu bộ phận giả định"}, "answer": "B", "marked": ["B"]}, {"n": 113, "orig": "154. Cho quy phạm pháp luật sau: “Người nào quảng cáo gian dối về hàng hóa, dịch vụ, đã bị xử phạt vi phạm hành chính về hành vi này hoặc đã bị kết án về tội này, chưa được xóa án tích mà còn vi phạm, thì bị phạt tiền từ 10.000.000 đồng đến 100.000.000 đồng hoặc phạt cải tạo không giam giữ đến 03 năm.” ( Khoản 1 Điều 197 Bộ luật Hình sự 2015, sửa đổi bổ sung năm 2025)", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Người nào quảng cáo gian dối về hàng hóa, dịch vụ, đã bị xử phạt vi phạm hành chính về hành vi này hoặc đã bị kết án về tội này, chưa được xóa án tích mà còn vi phạm", "B": "Người nào quảng cáo gian dối về hàng hóa, dịch vụ", "C": "Người nào", "D": "Quy phạm pháp luật trên khuyết thiếu bộ phận giả định"}, "answer": "A", "marked": ["A"]}, {"n": 114, "orig": "155. Cho quy phạm pháp luật sau: “Người lao động làm thêm giờ vào ban đêm thì ngoài việc trả lương theo quy định tại khoản 1 và khoản 2 Điều này, người lao động còn được trả thêm 20% tiền lương tính theo đơn giá tiền lương hoặc tiền lương theo công việc làm vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết.” (Khoản 3 Điều 98 Bộ luật Lao động 2019)", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Giả định và quy định", "B": "Quy định và chế tài", "C": "Chế tài và giả định", "D": "Đầy đủ cả 3 bộ phận"}, "answer": "A", "marked": ["A"]}, {"n": 115, "orig": "156. Cho quy phạm pháp luật trên: “Bên thuê phải trả lại tài sản thuê trong tình trạng như khi nhận, trừ hao mòn tự nhiên hoặc theo đúng như tình trạng đã thỏa thuận; nếu giá trị của tài sản thuê bị giảm sút so với tình trạng khi nhận thì bên cho thuê có quyền yêu cầu bồi thường thiệt hại, trừ hao mòn tự nhiên” (Khoản 1 Điều 482 Bộ luật Dân sự 2015)", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "“phải trả lại tài sản thuê trong tình trạng như khi nhận, trừ hao mòn tự nhiên hoặc theo đúng như tình trạng đã thỏa thuận; nếu giá trị của tài sản thuê bị giảm sút so với tình trạng khi nhận thì bên cho thuê có quyền yêu cầu bồi thường thiệt hại, trừ hao mòn tự nhiên” là bộ phận quy định của quy phạm pháp luật trên", "B": "Quy phạm pháp luật trên  đầy đủ cả 3 bộ phận", "C": "Quy phạm pháp luật trên chỉ có 2 bộ phận là giả định và chế tài", "D": "Quy phạm pháp luật trên chỉ có 2 bộ phận là giả định và quy định KHÓ"}, "answer": "D", "marked": ["D"]}, {"n": 116, "orig": "1. Chủ thể nào sau đây không có thẩm quyền ban hành Thông tư?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Thủ tướng Chính phủ", "B": "Bộ trưởng", "C": "Chánh án Tòa án nhân dân tối cao", "D": "Viện trưởng Viện kiểm sát nhân dân tối cao"}, "answer": "A", "marked": ["A"]}, {"n": 117, "orig": "2. Thẩm quyền ban hành Nghị định thuộc về chủ thể nào sau đây?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Chính phủ", "B": "Chủ tịch nước", "C": "Hội đồng nhân dân cấp tỉnh", "D": "Ủy ban thường vụ Quốc hội"}, "answer": "A", "marked": ["A"]}, {"n": 118, "orig": "3. Ủy ban nhân dân cấp tỉnh có thẩm quyền ban hành văn bản quy phạm pháp luật nào sau đây?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Quyết định", "B": "Nghị quyết", "C": "Chỉ thị", "D": "Nghị định"}, "answer": "A", "marked": ["A"]}, {"n": 119, "orig": "4. Chủ tịch nước có thẩm quyền ban hành văn bản quy phạm pháp luật nào sau đây?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Lệnh", "B": "Thông tư", "C": "Nghị quyết", "D": "Luật"}, "answer": "A", "marked": ["A"]}, {"n": 120, "orig": "5. Thủ tướng chính phủ có thẩm quyền ban hành văn bản quy phạm pháp luật nào sau đây?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "Quyết định", "B": "Thông tư", "C": "Nghị quyết", "D": "Nghị định TRUNG BÌNH"}, "answer": "A", "marked": ["A"]}, {"n": 121, "orig": "6. Sắp xếp các văn bản quy phạm pháp luật sau theo thứ tự giá trị pháp lý tăng dần từ trái sang phải: Hiến pháp 2013 (1), Bộ luật Dân sự 2015 (2), Nghị quyết số 03/2025/NQ-HĐTP của Hội đồng thẩm phán Toà án nhân dân tối cao hướng dẫn áp dụng một số quy định về chuyển hình phạt tử hình thành tù chung thân (3)?", "chapter": "Chương 5. văn bản quy phạm pháp luật", "options": {"A": "(3), (2), (1)", "B": "(1), (2), (3)", "C": "(2), (3), (1)", "D": "(3), (1), (2)"}, "answer": "A", "marke tions": {"A": "Lạm quyền", "B": "Tham ô tài sản", "C": "Nhận hối lộ", "D": "Vi phạm quy chế tài sản"}, "answer": "B", "marked": ["B"]}, {"n": 146, "orig": "3. Sinh viên E thực tập tại Sở Kế hoạch – Đầu tư. E không được giao nhiệm vụ chính thức, nhưng tự ý sửa tài liệu trong máy tính và “gợi ý” doanh nghiệp đưa tiền để xin dự án.", "chapter": "Chương 8. Một số ngành luật trong hệ thống pháp luật Việt Nam", "options": {"A": "Có, vì E có mặt trong cơ quan nhà nước. Ngày Giỗ Tổ Hùng Vương (10/3 âm lịch) được nghỉ có hưởng lương 1 ngày Ngày nghỉ lễ có được hưởng lương Ngày thương binh liệt sĩ 27/7 3 ngày", "B": "Không, vì E không phải người được giao nhiệm vụ, quyền hạn. Ngày 2/9 chỉ được nghỉ có hưởng lương khi doanh nghiệp cho phép 2 ngày Ngày nghỉ lễ nhưng không được hưởng lương Ngày giáng sinh 25/12 5 ngày", "C": "Có, vì E tác động đến doanh nghiệp. Ngày khai giảng 5/9 được nghỉ 1 ngày có hưởng lương 3 ngày Ngày làm việc bình thường Ngày Quốc tế lao động 1/5 7 ngày", "D": "Có thể bị xử lý hình sự hoặc kỷ luật lao động, nhưng không phải chủ thể tham nhũng theo Luật PCTN. Câu hỏi trắc nghiệm Pháp luật lao động Câu 1. Theo quy định của Pháp luật lao động hiện hành, khẳng định nào sau đây đúng đối với quy định về thời giờ nghỉ ngơi của người lao động? Ngày 30/4 được nghỉ nhưng không được hưởng lương Câu 2. Người lao động được nghỉ hưởng nguyên lương bao nhiêu ngày vào dịp Quốc khánh 2/9? Dịp Quốc khánh 2/9 người lao động được nghỉ nhưng không được hưởng lương Câu 3. Ngày 1/6 (Quốc tế Thiếu nhi) theo pháp luật lao động là: Ngày nghỉ do người lao động tự quyết định Câu 1: Trong các ngày lễ sau đây, ngày nào mà người lao động được nghỉ 1 ngày và hưởng nguyên lương? Ngày Nhà giáo Việt Nam 20/11 Câu 2: Theo quy định của pháp luật lao động thì người lao động được nghỉ bao nhiêu ngày vào dịp tết âm lịch có hưởng lương? 9 ngày"}, "answer": null, "marked": ["A", "B", "C", "D"]}];let submitted=false;const quiz=document.getElementById('quiz'),count=document.getElementById('count'),fill=document.getElementById('fill'),status=document.getElementById('status');count.textContent=data.length+' câu';
function render(){quiz.innerHTML='';data.forEach((q,i)=>{let d=document.createElement('div');d.className='q';d.id='q'+i;d.innerHTML='<div class="chapter">'+esc(q.chapter)+'</div><h3>Câu '+q.n+'. '+esc(q.orig.replace(/^\s*\d+\.\s*/,''))+'</h3>';for(const l of ['A','B','C','D'])if(q.options[l]){let lab=document.createElement('label');lab.className='opt';lab.innerHTML='<input type="radio" name="q'+i+'" value="'+l+'"> <b>'+l+'.</b> '+esc(q.options[l]);d.appendChild(lab)}quiz.appendChild(d)});update()}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function update(){let done=0;data.forEach((q,i)=>{if(document.querySelector('input[name=q'+i+']:checked'))done++});fill.style.width=(done/data.length*100)+'%';status.textContent='Đã chọn '+done+'/'+data.length}
quiz.addEventListener('change',update);
document.getElementById('submit').onclick=()=>{let unanswered=[];data.forEach((q,i)=>{if(!document.querySelector('input[name=q'+i+']:checked'))unanswered.push(i+1)});if(unanswered.length){alert('Bạn chưa chọn '+unanswered.length+' câu. Câu chưa chọn: '+unanswered.slice(0,30).join(', ')+(unanswered.length>30?'...':''));return}let score=0;data.forEach((q,i)=>{let chosen=document.querySelector('input[name=q'+i+']:checked').value;let labels=document.querySelectorAll('#q'+i+' .opt');labels.forEach(x=>{let v=x.querySelector('input').value;x.querySelector('input').disabled=true;if(v===q.answer)x.classList.add('correct');if(v===chosen&&v!==q.answer)x.classList.add('wrong')});if(chosen===q.answer)score++});submitted=true;document.getElementById('result').classList.remove('hidden');document.getElementById('result').innerHTML='<div class="result">Kết quả: '+score+'/'+data.length+' ('+(score/data.length*100).toFixed(1)+'%)</div><p>Đáp án đúng đã được hiện bằng khung xanh; câu bạn chọn sai có khung đỏ.</p>';document.getElementById('submit').style.display='none';document.getElementById('reset').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('reset').onclick=()=>location.reload();render();</script></body></html>
